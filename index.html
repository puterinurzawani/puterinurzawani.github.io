<!DOCTYPE html>
<html lang="ms">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puteri Nurzawani – Portfolio</title>
  <style>
    :root {
      --bg: #0e1220;
      --ink: #f3efe6;
      --muted: #a9a4b8;
      --rose: #f4a7b9;
      --gold: #f0c987;
      --teal: #7fe0d4;
      --glass: rgba(255, 255, 255, .055);
      --edge: rgba(255, 255, 255, .12);
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(80vmax 60vmax at 50% 120%, rgba(244, 167, 185, .18), transparent 60%),
        var(--bg);
      overflow: hidden;
      perspective: 1200px;
    }

    /* ---------- Latar belakang ---------- */
    .bubbles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bubbles i {
      position: absolute;
      bottom: -10vh;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, .9), var(--c) 40%, transparent 70%);
      opacity: 0;
      filter: blur(1px);
      animation: float var(--d) linear infinite var(--delay);
    }

    @keyframes float {
      0% {
        transform: translateY(0) translateX(0) scale(.6);
        opacity: 0;
      }

      10% {
        opacity: .55;
      }

      90% {
        opacity: .35;
      }

      100% {
        transform: translateY(-120vh) translateX(var(--x)) scale(1.1);
        opacity: 0;
      }
    }

    .rings {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .rings i {
      position: absolute;
      left: 50%;
      top: 50%;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .06);
      translate: -50% -50%;
      animation: orbit var(--d) linear infinite;
    }

    .rings i::before {
      content: "";
      position: absolute;
      top: -4px;
      left: 50%;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--c);
      box-shadow: 0 0 14px var(--c);
    }

    .rings i:nth-child(1) {
      width: 70vmin;
      height: 70vmin;
      --d: 40s;
      --c: var(--teal);
    }

    .rings i:nth-child(2) {
      width: 100vmin;
      height: 100vmin;
      --d: 60s;
      --c: var(--rose);
      animation-direction: reverse;
    }

    .rings i:nth-child(3) {
      width: 130vmin;
      height: 130vmin;
      --d: 85s;
      --c: var(--gold);
    }

    @keyframes orbit {
      to {
        transform: rotate(360deg);
      }
    }

    /* ---------- Kad ---------- */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      padding: 44px 38px 38px;
      background: var(--glass);
      border-radius: 28px;
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      box-shadow:
        0 40px 100px -40px rgba(0, 0, 0, .9),
        inset 0 1px 0 rgba(255, 255, 255, .12);
      transform-style: preserve-3d;
      transition: transform .15s ease-out;
      animation: enter 1.1s cubic-bezier(.2, .8, .2, 1) both;
      --mx: 50%;
      --my: 50%;
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: rotateX(18deg) translateY(50px) scale(.95);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @property --angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: conic-gradient(from var(--angle, 0deg), var(--rose), var(--gold), var(--teal), var(--rose));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: .7;
      animation: turn 8s linear infinite;
      pointer-events: none;
    }

    @keyframes turn {
      to {
        --angle: 360deg;
      }
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(260px circle at var(--mx) var(--my), rgba(255, 255, 255, .10), transparent 60%);
      opacity: 0;
      transition: opacity .4s;
      pointer-events: none;
    }

    .card:hover::after {
      opacity: 1;
    }

    .card>* {
      position: relative;
      animation: slide .7s cubic-bezier(.2, .8, .2, 1) both;
    }

    .card>*:nth-child(1) {
      animation-delay: .35s;
    }

    .card>*:nth-child(2) {
      animation-delay: .45s;
    }

    .card>*:nth-child(3) {
      animation-delay: .55s;
    }

    .card>*:nth-child(4) {
      animation-delay: .65s;
    }

    .card>*:nth-child(5) {
      animation-delay: .75s;
    }

    .card>*:nth-child(6) {
      animation-delay: .85s;
    }

    .card>*:nth-child(7) {
      animation-delay: .95s;
    }

    .card>*:nth-child(8) {
      animation-delay: 1.05s;
    }

    @keyframes slide {
      from {
        opacity: 0;
        transform: translateX(-18px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* Nama */
    h1 {
      margin: 0;
      font: 700 clamp(1.8rem, 6vw, 2.2rem)/1.1 Georgia, "Palatino Linotype", serif;
      letter-spacing: -.02em;
      animation: none;
    }

    h1 span {
      display: inline-block;
      background: linear-gradient(90deg, var(--ink), var(--gold), var(--ink));
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      opacity: 0;
      animation:
        pop .6s cubic-bezier(.2, .8, .2, 1) both calc(.45s + var(--i) * 45ms),
        shimmer 5s linear infinite calc(1.6s + var(--i) * 45ms);
    }

    h1 span:empty {
      width: .3em;
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(18px) rotate(6deg) scale(.8);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes shimmer {
      to {
        background-position: -200% 0;
      }
    }

    /* Peranan ditaip */
    .role {
      margin: 6px 0 10px;
      color: var(--muted);
      font-size: 1.05rem;
      min-height: 1.7em;
    }

    .role::after {
      content: "";
      display: inline-block;
      width: 2px;
      height: 1.1em;
      margin-left: 3px;
      vertical-align: -2px;
      background: var(--teal);
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    /* Email di atas, bawah peranan */
    .mail {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 32px;
      padding: 6px 14px 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--edge);
      background: rgba(255, 255, 255, .04);
      color: var(--ink);
      text-decoration: none;
      font-size: .95rem;
      transition: border-color .3s, background .3s, transform .3s cubic-bezier(.2, .8, .2, 1);
    }

    .mail svg {
      width: 18px;
      height: 18px;
      fill: var(--teal);
    }

    .mail:hover {
      border-color: var(--teal);
      background: rgba(127, 224, 212, .12);
      transform: translateY(-2px);
    }

    .mail:focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: 4px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .06em;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    h2::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--edge), transparent);
      transform-origin: left;
      animation: grow 1s ease both 1.1s;
    }

    @keyframes grow {
      from {
        transform: scaleX(0);
      }
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 30px;
      padding: 0;
      list-style: none;
    }

    .skills li {
      padding: 7px 18px;
      border-radius: 999px;
      border: 1px solid var(--edge);
      background: rgba(255, 255, 255, .04);
      font-weight: 500;
      animation: bob 4s ease-in-out infinite 2s;
      transition: transform .3s cubic-bezier(.2, .8, .2, 1), background .3s, border-color .3s;
    }

    @keyframes bob {
      50% {
        translate: 0 -3px;
      }
    }

    .skills li:hover {
      transform: translateY(-3px) rotate(-2deg);
      border-color: var(--teal);
      background: rgba(127, 224, 212, .12);
    }

    blockquote {
      margin: 0 0 34px;
      padding: 16px 18px 16px 22px;
      border-left: 3px solid var(--rose);
      background: linear-gradient(90deg, rgba(244, 167, 185, .10), transparent);
      border-radius: 0 16px 16px 0;
      font: italic 1.1rem/1.5 Georgia, "Palatino Linotype", serif;
      position: relative;
      overflow: hidden;
    }

    blockquote::before {
      content: "\201C";
      position: absolute;
      right: 14px;
      top: -14px;
      font: 700 90px/1 Georgia, serif;
      color: rgba(244, 167, 185, .15);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 22px;
      border-radius: 999px;
      color: #15121c;
      background: linear-gradient(90deg, var(--gold), var(--rose));
      text-decoration: none;
      font-weight: 600;
      box-shadow: 0 12px 30px -12px var(--rose);
      transition: transform .25s cubic-bezier(.2, .8, .2, 1), box-shadow .3s;
      position: relative;
    }

    .btn::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: inherit;
      border: 2px solid var(--rose);
      opacity: 0;
      animation: pulse 2.6s ease-out infinite 2s;
    }

    @keyframes pulse {
      0% {
        opacity: .6;
        transform: scale(1);
      }

      100% {
        opacity: 0;
        transform: scale(1.25);
      }
    }

    .btn:hover {
      box-shadow: 0 18px 40px -12px var(--rose);
    }

    .btn:focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: 4px;
    }

    .btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }

      h1 span {
        opacity: 1;
      }

      .card {
        transform: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="bubbles" aria-hidden="true">
    <i style="--c:var(--rose);left:8%; width:14px;height:14px;--d:14s;--delay:0s;--x:6vw"></i>
    <i style="--c:var(--teal);left:18%;width:9px; height:9px; --d:18s;--delay:-6s;--x:-4vw"></i>
    <i style="--c:var(--gold);left:30%;width:18px;height:18px;--d:16s;--delay:-11s;--x:5vw"></i>
    <i style="--c:var(--teal);left:42%;width:7px; height:7px; --d:20s;--delay:-3s;--x:-7vw"></i>
    <i style="--c:var(--rose);left:55%;width:12px;height:12px;--d:15s;--delay:-9s;--x:3vw"></i>
    <i style="--c:var(--gold);left:66%;width:10px;height:10px;--d:19s;--delay:-14s;--x:-5vw"></i>
    <i style="--c:var(--rose);left:76%;width:16px;height:16px;--d:17s;--delay:-2s;--x:6vw"></i>
    <i style="--c:var(--teal);left:88%;width:8px; height:8px; --d:21s;--delay:-7s;--x:-3vw"></i>
    <i style="--c:var(--gold);left:94%;width:13px;height:13px;--d:16s;--delay:-12s;--x:4vw"></i>
  </div>
  <div class="rings" aria-hidden="true"><i></i><i></i><i></i></div>

  <main class="card" id="card">
    <h1 id="name">Puteri Nurzawani</h1>
    <p class="role" id="role" data-text="Systems Engineer">Systems Engineer</p>

    <a class="mail" href="mailto:puterinurzawani@gmail.com">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path

      </svg>
      puterinurzawani@gmail.com
    </a>

    <h2>Kemahiran</h2>
    <ul class="skills">
      <li>DevOps</li>
      <li>Linux</li>
    </ul>

    <h2>Fakta menarik</h2>
    <blockquote>Saya suka duduk rumah.</blockquote>

    <a class="btn" id="btn" href="https://github.com/puterinurzawani">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path
          d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.23.83 1.23.83.72 1.23 1.88.87 2.33.67.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.7 7.7 0 0 1 8 3.87c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
      </svg>
      GitHub saya
    </a>
  </main>

  <script>
    (function () {
      try {
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var canHover = window.matchMedia('(hover: hover)').matches;

        var name = document.getElementById('name');
        var letters = name.textContent.split('');
        name.textContent = '';
        letters.forEach(function (ch, i) {
          var s = document.createElement('span');
          s.textContent = ch === ' ' ? '' : ch;
          s.style.setProperty('--i', i);
          name.appendChild(s);
        });

        var role = document.getElementById('role');
        var text = role.getAttribute('data-text');
        if (!reduce) {
          role.textContent = '';
          var i = 0;
          setTimeout(function type() {
            role.textContent = text.slice(0, ++i);
            if (i < text.length) setTimeout(type, 70);
          }, 1300);
        }

        var card = document.getElementById('card');
        if (!reduce && canHover) {
          card.addEventListener('mousemove', function (e) {
            var r = card.getBoundingClientRect();
            var px = e.clientX - r.left, py = e.clientY - r.top;
            var x = px / r.width - 0.5, y = py / r.height - 0.5;
            card.style.transform = 'rotateY(' + (x * 10) + 'deg) rotateX(' + (-y * 10) + 'deg)';
            card.style.setProperty('--mx', px + 'px');
            card.style.setProperty('--my', py + 'px');
          });
          card.addEventListener('mouseleave', function () { card.style.transform = ''; });
        }

        var btn = document.getElementById('btn');
        if (!reduce && canHover) {
          btn.addEventListener('mousemove', function (e) {
            var r = btn.getBoundingClientRect();
            var x = e.clientX - (r.left + r.width / 2);
            var y = e.clientY - (r.top + r.height / 2);
            btn.style.transform = 'translate(' + (x * 0.25) + 'px,' + (y * 0.35) + 'px) scale(1.04)';
          });
          btn.addEventListener('mouseleave', function () { btn.style.transform = ''; });
        }
      } catch (e) { }
    })();
  </script>
</body>

</html>
