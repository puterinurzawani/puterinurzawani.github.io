<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puteri – Portfolio</title>
<style>
  :root {
    --bg: #16131d;
    --card: #201b2b;
    --line: #352e45;
    --text: #ede8f5;
    --muted: #a79fb8;
    --accent: #c4b2ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 440px;
    padding: 36px 32px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
  }
  .avatar {
    width: 64px;
    height: 64px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--accent);
    color: #2a2040;
    font: 700 28px Georgia, "Palatino Linotype", serif;
  }
  h1 {
    margin: 20px 0 2px;
    font: 700 2.2rem/1.1 Georgia, "Palatino Linotype", serif;
  }
  .role { margin: 0 0 28px; color: var(--accent); }
  h2 {
    margin: 0 0 10px;
    font-size: 1rem;
    font-weight: 600;
    color: var(--muted);
  }
  .skills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 28px;
    padding: 0;
    list-style: none;
  }
  .skills li {
    padding: 4px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
  }
  blockquote {
    margin: 0 0 28px;
    padding-left: 14px;
    border-left: 3px solid var(--accent);
  }
  a { color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
  <main class="card">
    <div class="avatar" aria-hidden="true">P</div>
    <h1>Puteri</h1>
    <p class="role">Systems Engineer</p>

    <h2>Kemahiran</h2>
    <ul class="skills">
      <li>DevOps</li>
    </ul>

    <h2>Fakta menarik</h2>
    <blockquote>
      Saya suka duduk rumah.
    </blockquote>

    <a href="https://github.com/puterinurzawani">GitHub saya</a>
  </main>
</body>
</html>
